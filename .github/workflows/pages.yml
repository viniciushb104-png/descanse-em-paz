name: Compilar Godot e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e exportar Godot 4.7.2 para Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2 e templates oficiais
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz 'templates/*' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Extrair e conferir os 43 sprites do gato
        run: |
          set -euo pipefail
          test -s assets/cat/gato_santa_mortalha_sprites.zip
          unzip -oq assets/cat/gato_santa_mortalha_sprites.zip -d .
          python3 - <<'PY'
          import os
          animations = {"idle":4,"sit":5,"walk_left":8,"walk_right":8,"meow":4,"pet":6,"purr":4,"sleep":4}
          for animation, count in animations.items():
              for i in range(count):
                  path = f"assets/cat/{animation}_{i:02}.png"
                  if not os.path.isfile(path) or os.path.getsize(path) < 100:
                      raise SystemExit(f"Sprite do gato ausente ou vazio: {path}")
          print("Gato OK: 43 imagens PNG disponíveis antes da importação Godot")
          PY

      - name: Conferir referencias obrigatorias de recursos
        run: python3 tools/check_resources.py

      - name: Importar recursos e validar projeto
        run: godot --headless --path . --editor --quit

      - name: Testar gato e animacoes PNG
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-cemetery_cat_smoke" godot --headless --path . --script res://tests/cemetery_cat_smoke.gd

      - name: Testar aparicao e movimento do jogador
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-smoke" godot --headless --path . --script res://tests/smoke.gd

      - name: Validar piso e conexao dos caminhos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-ground_smoke" godot --headless --path . --script res://tests/ground_smoke.gd

      - name: Validar lobby ornamental, placas, iluminacao e interiores
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-lobby_smoke" godot --headless --path . --script res://tests/lobby_smoke.gd

      - name: Testar dez sprites individuais e acesso ao B-13
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-graves_smoke" godot --headless --path . --script res://tests/graves_smoke.gd

      - name: Testar arvores goticas e caminhos livres
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-trees_smoke" godot --headless --path . --script res://tests/trees_smoke.gd

      - name: Testar menu inicial e retorno ao jogo
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-menu_smoke" godot --headless --path . --script res://tests/menu_smoke.gd

      - name: Testar distrito, missões e legislação
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-district_smoke" godot --headless --path . --script res://tests/district_smoke.gd

      - name: Testar interiores, estoque e vinte casos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-interior_smoke" godot --headless --path . --script res://tests/interior_smoke.gd

      - name: Testar controle por toque e dialogos responsivos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-mobile_smoke" godot --headless --path . --script res://tests/mobile_smoke.gd

      - name: Testar diálogos e dificuldade progressiva
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_smoke" godot --headless --path . --script res://tests/dialogue_smoke.gd

      - name: Testar entrada direta e ritmo de dialogos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-pacing_smoke" godot --headless --path . --script res://tests/pacing_smoke.gd

      - name: Testar molduras e retratos de todos os personagens
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_frames_smoke" godot --headless --path . --script res://tests/dialogue_frames_smoke.gd

      - name: Validar molduras PNG do lote 1 e fallbacks
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_lote1_smoke" godot --headless --path . --script res://tests/dialogue_lote1_smoke.gd

      - name: Testar seis molduras individuais do lote 2
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_lote2_smoke" godot --headless --path . --script res://tests/dialogue_lote2_smoke.gd

      - name: Testar seis panoramas do translado
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-translado_panorama_smoke" godot --headless --path . --script res://tests/translado_panorama_smoke.gd

      - name: Validar retratos expressivos e galeria do Diario
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-portraits_expressions_smoke" godot --headless --path . --script res://tests/portraits_expressions_smoke.gd

      - name: Validar preferencias e capela do ultimo adeus
        run: godot --headless --path . --script res://tests/wake_smoke.gd

      - name: Validar nove novas atividades do distrito
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-district_activities_smoke" godot --headless --path . --script res://tests/district_activities_smoke.gd

      - name: Testar campanha de plataforma do fantasma
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-ghost" godot --headless --path . --script res://tests/ghost_adventure_smoke.gd

      - name: Testar sepultamento, persistencia e conclusao unica
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-oficio" godot --headless --path . --script res://tests/oficio_osvaldo_smoke.gd

      - name: Exportar versao Web sem threads
        run: |
          set -euo pipefail
          mkdir -p build/web
          VERSION="game-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-release "Web" "build/web/$VERSION.html"
          test -s "build/web/$VERSION.html"
          test -s "build/web/$VERSION.wasm"
          test -s "build/web/$VERSION.pck"
          cp "build/web/$VERSION.html" build/web/index.html
          printf '%s\n' "$GITHUB_SHA" > build/web/version.txt
          grep -F "$VERSION" build/web/index.html
          touch build/web/.nojekyll

      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar demo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar Pages
        id: deploy
        uses: actions/deploy-pages@v4
