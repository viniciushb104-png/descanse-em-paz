name: Compilar Godot e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar e exportar Godot 4.7.2 para Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2 e templates oficiais
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz 'templates/*' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Extrair e conferir os 43 sprites do gato
        run: |
          set -euo pipefail
          test -s assets/cat/gato_santa_mortalha_sprites.zip
          unzip -oq assets/cat/gato_santa_mortalha_sprites.zip -d .
          python3 - <<'PY'
          import os
          animations = {"idle":4,"sit":5,"walk_left":8,"walk_right":8,"meow":4,"pet":6,"purr":4,"sleep":4}
          for animation, count in animations.items():
              for i in range(count):
                  path = f"assets/cat/{animation}_{i:02}.png"
                  if not os.path.isfile(path) or os.path.getsize(path) < 100:
                      raise SystemExit(f"Sprite do gato ausente ou vazio: {path}")
          print("Gato OK: 43 imagens PNG disponíveis antes da importação Godot")
          PY

      - name: Preparar abertura cinematografica opcional
        run: |
          set -euo pipefail
          if [ -s assets/menu/abertura.ogv ]; then
            echo "Abertura OGV pronta."
          elif [ -s assets/menu/abertura.mp4 ]; then
            if ! command -v ffmpeg >/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y ffmpeg
            fi
            if ffmpeg -nostdin -hide_banner -loglevel error -y -i assets/menu/abertura.mp4 -vf "scale=960:540:force_original_aspect_ratio=decrease:force_divisible_by=2,pad=960:540:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24" -c:v libtheora -q:v 6 -c:a libvorbis -q:a 4 -ac 2 assets/menu/abertura.ogv; then
              echo "Abertura convertida para Godot."
            else
              rm -f assets/menu/abertura.ogv
              echo "::warning::Nao foi possivel converter a abertura. O menu continua disponivel."
            fi
          else
            echo "Abertura ainda nao enviada; menu direto habilitado."
          fi

      - name: Conferir referencias obrigatorias de recursos
        run: python3 tools/check_resources.py

      - name: Importar recursos e validar projeto
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Error importing|Error loading image|Failed to load script' /tmp/godot-import.log; then
            echo "Godot import reported errors; refusing to publish"
            exit 1
          fi

      - name: Testar gato e animacoes PNG
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-cemetery_cat_smoke" bash tools/run_smoke.sh res://tests/cemetery_cat_smoke.gd

      - name: Testar aparicao e movimento do jogador
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-smoke" bash tools/run_smoke.sh res://tests/smoke.gd

      - name: Validar piso e conexao dos caminhos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-ground_smoke" bash tools/run_smoke.sh res://tests/ground_smoke.gd

      - name: Validar lobby ornamental, placas, iluminacao e interiores
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-lobby_smoke" bash tools/run_smoke.sh res://tests/lobby_smoke.gd

      - name: Validar dez PNGs de muros e acessos do mapa
        timeout-minutes: 2
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-boundary" bash tools/run_smoke.sh res://tests/boundary_smoke.gd

      - name: Validar fisica de circulacao e profundidade
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-world-physics" bash tools/run_smoke.sh res://tests/world_physics_smoke.gd

      - name: Testar dez sprites individuais e acesso ao B-13
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-graves_smoke" bash tools/run_smoke.sh res://tests/graves_smoke.gd

      - name: Testar arvores goticas e caminhos livres
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-trees_smoke" bash tools/run_smoke.sh res://tests/trees_smoke.gd

      - name: Testar menu inicial e retorno ao jogo
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-menu_smoke" bash tools/run_smoke.sh res://tests/menu_smoke.gd

      - name: Testar distrito, missões e legislação
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-district_smoke" bash tools/run_smoke.sh res://tests/district_smoke.gd

      - name: Testar interiores, estoque e vinte casos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-interior_smoke" bash tools/run_smoke.sh res://tests/interior_smoke.gd

      - name: Testar controle por toque e dialogos responsivos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-mobile_smoke" bash tools/run_smoke.sh res://tests/mobile_smoke.gd

      - name: Testar diálogos e dificuldade progressiva
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_smoke" bash tools/run_smoke.sh res://tests/dialogue_smoke.gd

      - name: Testar entrada direta e ritmo de dialogos
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-pacing_smoke" bash tools/run_smoke.sh res://tests/pacing_smoke.gd

      - name: Testar molduras e retratos de todos os personagens
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_frames_smoke" bash tools/run_smoke.sh res://tests/dialogue_frames_smoke.gd

      - name: Validar molduras PNG do lote 1 e fallbacks
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_lote1_smoke" bash tools/run_smoke.sh res://tests/dialogue_lote1_smoke.gd

      - name: Testar seis molduras individuais do lote 2
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-dialogue_lote2_smoke" bash tools/run_smoke.sh res://tests/dialogue_lote2_smoke.gd

      - name: Testar seis panoramas do translado
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-translado_panorama_smoke" bash tools/run_smoke.sh res://tests/translado_panorama_smoke.gd

      - name: Validar retratos expressivos e galeria do Diario
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-portraits_expressions_smoke" bash tools/run_smoke.sh res://tests/portraits_expressions_smoke.gd

      - name: Validar preferencias e capela do ultimo adeus
        run: bash tools/run_smoke.sh res://tests/wake_smoke.gd

      - name: Validar nove novas atividades do distrito
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-district_activities_smoke" bash tools/run_smoke.sh res://tests/district_activities_smoke.gd

      - name: Validar expansao dos quatro quadrantes
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-expansion" bash tools/run_smoke.sh res://tests/expansion_smoke.gd

      - name: Testar campanha de plataforma do fantasma
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-ghost" bash tools/run_smoke.sh res://tests/ghost_adventure_smoke.gd

      - name: Testar sepultamento, persistencia e conclusao unica
        run: XDG_DATA_HOME="$RUNNER_TEMP/test-oficio" bash tools/run_smoke.sh res://tests/oficio_osvaldo_smoke.gd

      - name: Exportar versao Web sem threads
        run: |
          set -euo pipefail
          mkdir -p build/web
          VERSION="game-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-release "Web" "build/web/$VERSION.html"
          test -s "build/web/$VERSION.html"
          test -s "build/web/$VERSION.wasm"
          test -s "build/web/$VERSION.pck"
          cp "build/web/$VERSION.html" build/web/index.html
          printf '%s\n' "$GITHUB_SHA" > build/web/version.txt
          grep -F "$VERSION" build/web/index.html
          touch build/web/.nojekyll

      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar demo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar Pages
        id: deploy
        uses: actions/deploy-pages@v4
